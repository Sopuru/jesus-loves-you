<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c4001f">
<title>Jesus Loves You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #e0002a 0%, #7a0012 100%);
    color: #fff; text-align: center;
    font-family: "Anton", "Arial Black", Impact, sans-serif;
  }
  h1 {
    margin: 0; font-weight: 900; text-transform: uppercase;
    line-height: 0.92; letter-spacing: 0.01em;
    /* Fill the screen: grows with width, capped so 3 lines + heart fit in height */
    font-size: min(30vw, 22vh);
    -webkit-text-stroke: 0.02em #fff;
    text-shadow: 0 0.04em 0 #5a000d, 0 0 0.3em rgba(255,255,255,.5);
    animation: pulse 2.2s ease-in-out infinite;
  }
  .heart { display: block; font-size: 0.75em; margin-top: 0.1em; }
  @keyframes pulse { 50% { transform: scale(1.05); } }
</style>
</head>
<body>
  <h1>Jesus<br>Loves<br>You<span class="heart">❤️</span></h1>
</body>
</html>
